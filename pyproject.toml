[project]
name = "crucible"
version = "0.1.0"
description = "Evolutionary RL world that trains open models to shop on PayPal"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["catalog", "catalog.providers", "payments", "api"]
