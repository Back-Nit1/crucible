[project]
name = "crucible"
version = "0.1.0"
description = "Evolutionary RL world that trains open models to shop on PayPal"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "modal>=1.5,<1.6",
  "pydantic>=2.7",
  "pyyaml>=6",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
kernel = [
    "kernel>=0.139.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: hits real sandbox/cloud services; run with `pytest -m live` and credentials in the environment"]

[tool.setuptools]
packages = ["catalog", "catalog.providers", "payments", "api", "eval", "modal_app"]
