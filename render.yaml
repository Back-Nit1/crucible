# Render Blueprint (free plan only - this file never selects a paid plan). Verified keys: render.com/docs/blueprint-spec.
# `sync: false` values are prompted once at Blueprint creation; set them in the Render dashboard, never here.
# The Next.js `web` service is owned by the web app and added to this file when it exists.
services:
  - type: web
    name: crucible-web
    runtime: node
    rootDir: web
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24.11.1"
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # Public API origin only; set before build. Never place credentials here.
      - key: NEXT_PUBLIC_DATA_MODE
        value: live
  - type: web
    name: crucible-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PAYMENTS_BACKEND      # "sandbox" = PayPal sandbox (judge demo); anything else = mock
        value: sandbox
      - key: DEMO_MODE
        value: "1"
      - key: REQUIRE_ALL_IN_QUOTE
        value: "0"
      - key: ELASTIC_API_KEY
        sync: false
      - key: ELASTIC_ENDPOINT
        sync: false
      - key: ELASTIC_CLOUD_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false # optional, live product display only
      - key: CORS_ALLOW_ORIGINS
        sync: false # the crucible-web origin, e.g. https://crucible-web.onrender.com (comma list); empty = same-origin only
      - key: PAYPAL_RETURN_URL
        sync: false # https://<crucible-web host>/payments : where PayPal sends the buyer after approving
      - key: PAYPAL_CANCEL_URL
        sync: false # https://<crucible-web host>/
      - key: CRUCIBLE_MODEL_BACKEND
        sync: false # "qwen" attaches the Modal Qwen endpoint; unset = typed 503 model_unavailable. Also needs the human-set CRUCIBLE_MODAL_* gates
      - key: MODAL_TOKEN_ID
        sync: false # only needed when CRUCIBLE_MODEL_BACKEND=qwen
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
