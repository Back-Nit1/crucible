# Day-1 provider decisions (spec 15.4). Evidence: docs/spikes/platform-day1.md. Verified facts only.
status: decided-2026-10-31
live_chat: elastic_snapshot   # channel3 is opt-in: no review text, so no review-grounded picks (see DECISIONS.md)
training_eval: elastic_snapshot  # always; router ignores this key and pins training/eval to the snapshot
providers:
  elastic_snapshot:
    enabled: true
    reviews_source: amazon2023
    note: Amazon Reviews 2023 frozen snapshot (Hou et al. 2024, arXiv:2403.03952); research use, short excerpts only.
  channel3:
    enabled: true
    live_only: true
    reviews: none          # ratings rollup only
    snapshot_allowed: false  # ToS s.7 bars bulk caching and ML training on output
    note: Live product display only; short-TTL cache; commission disclosure if affiliate links shown.
  bestbuy:
    enabled: false
    note: Disabled. Developer signup unavailable (email restriction); not bypassed.

# Integration/runtime facts (measured 2026-11-01; evidence in docs/handoffs/integration-runtime.md)
snapshot:
  embedding_inference_id: .jina-embeddings-v5-text-nano   # 768d, EIS-hosted; e5-small cold start times out
  enumeration: iter_products(category)   # search_after paging, id-ordered, no cap; an empty search query is rejected
  review_ids: review_ids(product_id)     # complete, never truncated; get_reviews without focus pages past 10,000
  review_id_scheme: "amazon2023:parent_asin:asin:user_id:timestamp[:n]"   # source key kept in source_review_key
  stock_and_size: unverifiable            # Amazon Reviews 2023 has none; never generated
  tax_and_shipping: not_in_source         # snapshot quotes are basis=snapshot_declared (list price defined as all-in)
payments:
  bulk_runs: mock                         # world/generation runs never touch PayPal
  require_verified_quotes_env: REQUIRE_VERIFIED_QUOTES   # =1 rejects snapshot_declared quotes at propose time
